# Baseline CI — NOT a comprehensive test suite.
#
# This workflow runs cheap, deterministic baseline checks: Python dependency
# install, pytest suite (hooks/tests + tests, excluding tests/generated), a
# current-tree secret scan, a shell-syntax pass (bash -n), a Python
# parse/compile pass over hooks/ and scripts/, and grep assertions for this
# repo's cleanup invariants.
name: baseline

on:
  push:
    branches: [master, main]
  pull_request:
  # Callable so the release pipeline can make these gates a REAL job-graph
  # dependency of publishing. A `needs:` cannot reference a job in another
  # workflow file, and a tag push matches neither trigger above, so without
  # workflow_call a tag could publish without these gates ever running on that
  # commit. Purely additive: the push/pull_request triggers are unchanged.
  workflow_call:
  # Weekly, so a dependency or runner change that breaks the suite shows up even
  # in a quiet week, and on demand.
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

jobs:
  baseline:
    name: baseline checks
    # Supported OS: ubuntu-latest (the declared, tested platform). macOS/Windows
    # are not part of the supported matrix.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Supported Python range. Floor is 3.10: hooks/ and scripts/ use match/case
        # statements and PEP 604 `X | None` annotations, both of which require 3.10+.
        # The matrix proves the harness installs + passes across the full supported
        # range rather than the author's single local interpreter.
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        # Pinned to a full 40-char commit SHA, not a mutable tag: a tag can be
        # repointed at arbitrary code by anyone who can push to the action repo.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history so the provenance audit can resolve commit-source lines
          # (e.g. 62957b3); a shallow clone would downgrade them to warnings and
          # verify-claims.sh runs the audit in --strict (downgrades hard-fail).
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Tracked settings.json is the clean form (render-settings check --staged)
        # CI backstop for the settings filter: the same check the pre-commit hook
        # runs, applied to this checkout's index (the commit under test). It fails
        # unless the tracked settings.json is a fixed point of the clean filter.
        # A runner has no overlay, so this catches what is machine-only by
        # definition (CLI-owned keys such as model, env.CLAUDE_HOME) and
        # non-canonical bytes; home paths in it fail check-public-core below.
        # It also fails while the overlay settings.machine.json or the private-literal
        # list private-literals.txt is in the index: both are personal, never tracked.
        # The gates below read this tracked file as-is; nothing is rendered here.
        run: python3 scripts/install/render-settings check --staged

      - name: Install Python dependencies
        # Hash-verified install from the lockfile matching THIS matrix leg.
        # --require-hashes makes pip reject the whole install if any requirement,
        # direct or transitive, is unpinned or unhashed.
        run: |
          set -euo pipefail
          lock="requirements/py$(echo '${{ matrix.python-version }}' | tr -d '.').txt"
          echo "Installing from $lock"
          python3 -m pip install --require-hashes -r "$lock"

      - name: Clean-install smoke
        # Reproducibility guarantee: prove a CLEAN environment, installed by an
        # UNPRIVILEGED user, can install the declared deps and import the key
        # modules. Builds a THROWAWAY venv under a mktemp dir (never the repo/user
        # venv) and installs hash-verified from the lockfile matching the running
        # interpreter. Both properties are load-bearing and are asserted, not
        # assumed: the uid guard EXITS NON-ZERO under root rather than merely
        # printing the uid, and the fresh mktemp+venv provisioning is what makes
        # this a clean-install test rather than a re-import of the job's venv.
        run: |
          set -euo pipefail
          if [ "$(id -u)" -eq 0 ]; then
            echo "::error::clean-install smoke must run as an unprivileged user, but uid is 0"
            exit 1
          fi
          echo "Running as uid $(id -u) ($(id -un)) — non-root, as required."
          smoke_root="$(mktemp -d)"
          smoke_venv="$smoke_root/smoke-venv"
          echo "Creating throwaway venv at $smoke_venv ..."
          python3 -m venv "$smoke_venv"
          "$smoke_venv/bin/python" -m pip install --upgrade pip
          lock="requirements/py$("$smoke_venv/bin/python" -c 'import sys; print(f"{sys.version_info.major}{sys.version_info.minor}")').txt"
          echo "Installing hash-verified from $lock ..."
          "$smoke_venv/bin/python" -m pip install --require-hashes -r "$lock"
          echo "Importing declared modules in the clean venv ..."
          "$smoke_venv/bin/python" -c "import importlib.metadata as m, pytest, jsonschema, yaml; print('clean-install smoke OK — pytest', m.version('pytest'), '/ jsonschema', m.version('jsonschema'), '/ pyyaml', m.version('pyyaml'))"
          rm -rf "$smoke_root"

      - name: Run tests
        # tests/test_artifact_graph.py replays every pipeline traced in a sandbox;
        # the artifact-graph jobs below run it: shards with strace and a mount
        # namespace, then the check over all of them.
        run: python3 -m pytest hooks/tests tests -q --ignore=tests/generated --ignore=tests/test_artifact_graph.py

      - name: Shell tests (checkpoint privacy gate, push guards, fresh-clone smoke)
        # Shell suites pytest does not collect, run as the runner's non-root user like
        # every other step. Each exits non-zero on its first failed assertion.
        run: |
          set -euo pipefail
          bash hooks/tests/test_checkpoint_pii_gate.sh
          bash hooks/tests/test_push_no_upstream_guard.sh
          bash hooks/tests/test_push_sentinel_abort.sh
          bash hooks/tests/test_push_gate_ancestor_cross_session.sh
          bash tests/fresh-clone-bootstrap-smoke.sh

      - name: Installer acceptance (core profile)
        # Installs, verifies and uninstalls the core profile against fixtures in a temp
        # directory (a healthy host staged there; nothing outside it is written).
        run: python3 scripts/install/tests/installer-acceptance.py

      - name: Secret scan (current tree)
        run: |
          set -euo pipefail
          echo "Scanning tracked files for obvious secret patterns..."
          patterns='sk-[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|-----BEGIN [A-Z ]*PRIVATE KEY-----|xox[baprs]-[A-Za-z0-9-]+'
          if git grep -nIE "$patterns" -- . ; then
            echo "::error::Potential secret detected in tracked files"
            exit 1
          fi
          echo "No obvious secrets found."

      - name: Shell syntax check (bash -n)
        run: |
          set -euo pipefail
          echo "Running bash -n on tracked shell scripts..."
          fail=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            if ! bash -n "$f"; then
              echo "::error file=$f::bash -n failed"
              fail=1
            fi
          done < <(git ls-files '*.sh' '*.bash')
          exit "$fail"

      - name: Python parse/compile (hooks + scripts)
        run: |
          set -euo pipefail
          echo "Compiling tracked Python under hooks/ and scripts/..."
          mapfile -t pyfiles < <(git ls-files 'hooks/**/*.py' 'hooks/*.py' 'scripts/**/*.py' 'scripts/*.py')
          if [ "${#pyfiles[@]}" -eq 0 ]; then
            echo "No Python files found under hooks/ or scripts/."
            exit 0
          fi
          python3 -m py_compile "${pyfiles[@]}"
          echo "All hooks/ and scripts/ Python compiled."

      - name: Cleanup invariant assertions (zero-hit grep)
        run: |
          set -euo pipefail
          echo "Asserting cleanup invariants from this repo's public-hygiene prep..."
          # Patterns and the excluded path are assembled from fragments so this
          # workflow file does not itself contain the literal residual strings it
          # forbids, nor the literal scratch-test path it must not execute (both
          # would self-trip assertions against this version-controlled file). The
          # per-cycle scratch test directory is excluded from the residual grep
          # because its acceptance-criteria docstrings/fixtures legitimately name
          # the very patterns under test — those are not residual references.
          status=0
          exclude=":(exclude)tests/""generated/"
          pat_excel="artifact-excel""-analyzer"
          pat_oldrepo="claude-code""-config"
          if git grep -nIE "$pat_excel" -- . "$exclude" ; then
            echo "::error::residual analyzer reference still present"; status=1
          fi
          if git grep -nIE "$pat_oldrepo" -- . "$exclude" ; then
            echo "::error::stale repo name still present"; status=1
          fi
          pat_rootdocs="/roo""t/docs"
          if git grep -nIE "$pat_rootdocs" -- README.md ARCHITECTURE.md ; then
            echo "::error::broken grounding-doc links still present in README/ARCHITECTURE"; status=1
          fi
          exit "$status"

      - name: Public/private boundary gate (check-public-core.sh)
        # PUBLIC-CORE.md declares this boundary checker gates CI; wire it as a required step
        # of the `baseline` job so a new top-level tracked path escaping classification, an
        # invalid class label, or an author-environment residue marker leaking (un-parameterized)
        # into a public-core file FAILS the build. Recomputes the tracked-path set from git each
        # run — nothing hardcoded. Exits non-zero on any boundary violation.
        run: bash scripts/check-public-core.sh

      - name: Verify headline claims (hero provenance + enforcement evidence)
        # Runs as a step of the already-required `baseline` job so it gates merges by
        # default (no branch-protection change needed). Runs the hero-provenance
        # audits in --strict and the hero status/provenance and corpus checks.
        # Also runs scripts/check-enforcement-evidence.py --ledger and --claims, which gate
        # docs/ENFORCEMENT-LEDGER.md against settings.json and against the guard sources.
        run: bash scripts/verify-claims.sh

      # ---------------------------------------------------------------------
      # Enforcement evidence: run the adversarial corpus at the subprocess
      # boundary and publish a machine-readable manifest of what was ACTUALLY
      # exercised. Additive: both steps are new, and neither alters any
      # pre-existing step's triggering condition or success criterion.
      # ---------------------------------------------------------------------
      - name: Adversarial corpus suite (component / subprocess boundary)
        # The suite deletes any stale manifest before running and writes results
        # only from live invocations, so the artifact is evidence of EXECUTION
        # rather than evidence of authorship. This is component-tested proof and
        # is NOT a substitute for R3 (tests against real Claude Code builds).
        # The suite writes its manifest only where this names it, so an ordinary
        # pytest run (Run tests above, a read-only checkout) leaves the tree clean.
        env:
          ENFORCEMENT_RUN_MANIFEST: hooks/tests/.enforcement-run-manifest.json
        run: python3 -m pytest hooks/tests/test_blackbox_integration.py -q

      - name: Upload enforcement-evidence manifest
        # if: always() so the evidence survives a failing suite -- an artifact
        # published only on green runs cannot show what a red run exercised.
        if: always()
        # Pinned to a full 40-char commit SHA, matching every other action in this
        # repository: a tag can be repointed at arbitrary code by anyone who can
        # push to the action repo. SHA resolved from the upstream repository at
        # implementation time, not written from memory.
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          # Matrix-unique: a fixed name would have each Python leg silently
          # overwrite the previous leg's evidence.
          name: enforcement-evidence-py${{ matrix.python-version }}
          path: hooks/tests/.enforcement-run-manifest.json
          if-no-files-found: warn

      - name: Enforcement-evidence coverage gate
        # Fails the build when the manifest does not map one-to-one onto the
        # corpus, when any result field is unpopulated, when an observed outcome
        # is not bound to captured process evidence, or when the executed /
        # emitted / corpus case-ID sets disagree. A manifest that cannot
        # distinguish "exercised" from "asserted" does not show what ran.
        run: python3 scripts/check-enforcement-evidence.py --coverage

  artifact-graph-plan:
    # P1b row 19: the artifact check derives every write/read relation at test
    # time from the code and from traced replays of each pipeline driver
    # (tests/replay). On one runner its replays and E1's differential took 70
    # minutes (b8e34f4), over E2's 1500 s, so they run in shards by pipeline
    # (E2's remedy) and one job derives the check over all of them. This job
    # plans the shards from the drivers present (tests/replay/drivers/) and the
    # cost each declares (tests/artifact_graph/shards.py): the fewest shards
    # whose expected critical path fits 90% of the budget, each pipeline whole
    # in one, and E1's mode for the whole job. No driver is named here: a new
    # one lands in a shard by itself.
    name: artifact check plan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install --require-hashes -r requirements/py312.txt

      - name: Plan the shards
        id: plan
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          python3 -m tests.artifact_graph.check --tree . --plan > "$RUNNER_TEMP/plan.json"
          cat "$RUNNER_TEMP/plan.json"
          echo "count=$(jq -r .count "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"
          echo "matrix=$(jq -c .matrix "$RUNNER_TEMP/plan.json")" >> "$GITHUB_OUTPUT"

  artifact-graph-shard:
    # One shard of the plan: its drivers' traced replays (strace, and a mount
    # namespace through the runner's passwordless sudo) and E1's differential,
    # in the mode the plan decided for the whole job. Its runs/ and its record
    # go to the job below, which derives the check over every shard.
    name: artifact check shard ${{ matrix.shard }}/${{ needs.artifact-graph-plan.outputs.count }}
    needs: artifact-graph-plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.artifact-graph-plan.outputs.matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install strace and Python dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y strace
          python3 -m pip install --require-hashes -r requirements/py312.txt

      - name: Replays and differential of this shard
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: >-
          python3 -m tests.artifact_graph.check --tree . --work "$RUNNER_TEMP/artifact-graph"
          --shard "${{ matrix.shard }}/${{ needs.artifact-graph-plan.outputs.count }}"

      - name: Upload this shard's replays
        # if: always(): the merge reports a failed replay with the rest, and its
        # record holds the shard's time per phase.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-check-shard-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/artifact-graph/runs/
            ${{ runner.temp }}/artifact-graph/shards/
          if-no-files-found: error
          retention-days: 7

  artifact-graph:
    # The check over every shard's replays: the job keeps the name of the
    # single job it replaces. tests/test_artifact_graph.py with
    # ARTIFACT_GRAPH_REUSE=1 is the check's --reuse --no-differential path: it
    # derives the map over the union of the shards' replays and asserts every
    # replay exited 0 in both settings, no violation, and the static half's
    # determinism; a shard that is missing or ran another plan fails it. It runs
    # when a shard fails too, so that failure is reported with the rest.
    name: artifact check (traced replays)
    needs: [artifact-graph-plan, artifact-graph-shard]
    if: ${{ !cancelled() && needs.artifact-graph-plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: python3 -m pip install --require-hashes -r requirements/py312.txt

      - name: Download every shard's replays
        # Pinned to a full commit SHA like every other action here, resolved
        # from the upstream repository's tag at implementation time.
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: artifact-check-shard-*
          merge-multiple: true
          path: ${{ runner.temp }}/artifact-graph

      - name: Artifact check
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          # check.json holds the time of each phase, each shard and each replay and
          # differential (-s prints the same lines as the check runs).
          ARTIFACT_GRAPH_WORK: ${{ runner.temp }}/artifact-graph
          ARTIFACT_GRAPH_REUSE: "1"
        run: python3 -m pytest tests/test_artifact_graph.py -q -p no:cacheprovider -s

      - name: Upload the check's timing and violations
        # if: always(): a failing check's timing is the one the budget question needs.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: artifact-check
          path: |
            ${{ runner.temp }}/artifact-graph/check.json
            ${{ runner.temp }}/artifact-graph/violations.txt
          if-no-files-found: warn

  e2-probe:
    # P1b E2's probe (spec P1b.md, E2): strace's version on the runner, and a
    # two-pipeline traced replay under (a) a private mount namespace through the
    # runner's passwordless sudo and (b) a scratch HOME without a namespace,
    # recording wall time, relations and every write outside the scratch root
    # (each run's summary.tsv). It only records: it never fails the run, and a
    # later commit deletes it.
    name: E2 probe (records only)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Install strace and Python dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y strace
          python3 -m pip install --require-hashes -r requirements/py312.txt

      - name: strace version
        run: strace -V

      - name: Traced replays of /dev and /spec under (a) and (b)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -u
          out="$RUNNER_TEMP/e2-probe"
          mkdir -p "$out"
          for mode in ns scratch; do
            for driver in dev spec; do
              start=$(date +%s)
              python3 -m tests.replay run --tree . --out "$out/$mode-$driver" \
                --driver "$driver" --mode "$mode" --runs traced
              rc=$?
              echo "$mode $driver rc=$rc wall_s=$(( $(date +%s) - start ))" | tee -a "$out/walls.txt"
            done
          done
          for f in "$out"/*/summary.tsv; do echo "== $f"; cat "$f"; done

      - name: Upload the probe's records
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2-probe
          path: |
            ${{ runner.temp }}/e2-probe/walls.txt
            ${{ runner.temp }}/e2-probe/*/summary.tsv
            ${{ runner.temp }}/e2-probe/*/*/trace-stats.json
            ${{ runner.temp }}/e2-probe/*/*/outside-writes.txt
