# Release pipeline — tag-triggered, build-once, publish signed + checksummed + SBOM'd.
#
# Design rules this workflow exists to enforce, each of which was a real gap:
#   * the archive is built EXACTLY ONCE. The digest, the SBOM, the attestation and
#     the upload all reference that same file. Nothing is rebuilt between hashing
#     and publishing, so the digest cannot describe bytes other than the ones
#     consumers download.
#   * membership is an EXPLICIT manifest (release-membership.v1.json), not a class
#     rule. Public-core plus only the shared/infra assets required to install and
#     run; tests/ is excluded because the ledger itself calls it non-shippable.
#   * the residue/boundary gate runs against the EXTRACTED ARCHIVE, not the source
#     checkout — scanning the checkout proves nothing about packaged bytes.
#   * the release is verified by downloading the PUBLISHED asset back and checking
#     it end-to-end without rebuilding.
#   * a pre-release VERSION publishes a GitHub pre-release, so the published
#     release can never present as stable while the in-tree marker says otherwise.
name: release

on:
  push:
    tags:
      - "v*"

# Workflow-level default is READ-ONLY. The publishing job widens its own grant
# below; the called hygiene workflow keeps only what its steps need. A reusable
# workflow does NOT implicitly inherit the caller's permissions, so granting
# write here would hand the hygiene job rights it has no use for.
permissions:
  contents: read

jobs:
  # A tag push does not trigger baseline.yml (it fires on push-to-branch and
  # pull_request), and `needs:` cannot cross workflow files — so before this job
  # existed there was no way for the hygiene gates to be a precondition of
  # publishing. Calling the workflow runs it against the TAGGED commit, and the
  # publishing job `needs:` it, so a failed clean-install or boundary gate stops
  # the release instead of being discovered after the fact.
  hygiene:
    name: hygiene gates (clean install + boundary) on the tagged commit
    uses: ./.github/workflows/baseline.yml
    permissions:
      contents: read

  release:
    name: build, attest and publish
    needs: hygiene
    runs-on: ubuntu-latest
    permissions:
      contents: write        # create the release and upload assets
      id-token: write        # keyless signing for build provenance
      attestations: write    # record the provenance attestation
    steps:
      - name: Checkout
        # Pinned to a full 40-char commit SHA, not a mutable tag.
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Assert tag matches VERSION
        # Prevents publishing an archive whose in-tree version marker disagrees
        # with the tag it ships under.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="$(tr -d '[:space:]' < VERSION)"
          if [ "${tag#v}" != "$version" ]; then
            echo "::error::tag $tag does not match VERSION $version"
            exit 1
          fi
          echo "tag $tag matches VERSION $version"
          if printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+-'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
        id: version

      - name: Stage the release-membership path set
        # Resolved from the explicit manifest via the SAME module the residue gate
        # and the published-artifact verifier use, so the three cannot disagree.
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/stage/claude-harness-${GITHUB_REF_NAME}"
          mkdir -p "$stage"
          python3 scripts/lib/release_membership.py --from-git --root . \
            --manifest release-membership.v1.json > "$RUNNER_TEMP/members.txt"
          count="$(wc -l < "$RUNNER_TEMP/members.txt")"
          if [ "$count" -lt 1 ]; then
            echo "::error::release-membership resolved an empty path set"
            exit 1
          fi
          echo "staging $count path(s)"
          while IFS= read -r rel; do
            [ -n "$rel" ] || continue
            mkdir -p "$stage/$(dirname "$rel")"
            cp -p "$rel" "$stage/$rel"
          done < "$RUNNER_TEMP/members.txt"
          echo "STAGE=$stage" >> "$GITHUB_ENV"

      - name: Gate the staged tree (path set == manifest, zero residue)
        # Runs BEFORE packaging so a violation fails the release rather than
        # shipping. The same gate runs again on the extracted archive below.
        run: bash scripts/check-public-core.sh --scan-root "$STAGE" --release-manifest release-membership.v1.json

      - name: Build the archive (EXACTLY ONCE)
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/claude-harness-${GITHUB_REF_NAME}.tar.gz"
          # Deterministic: sorted entries, fixed owner/mtime, no gzip timestamp.
          tar --sort=name --owner=0 --group=0 --numeric-owner \
              --mtime="@${SOURCE_DATE_EPOCH:-0}" \
              -C "$(dirname "$STAGE")" -cf - "$(basename "$STAGE")" \
            | gzip -n > "$out"
          echo "ARCHIVE=$out" >> "$GITHUB_ENV"
          echo "ARCHIVE_NAME=$(basename "$out")" >> "$GITHUB_ENV"
        env:
          SOURCE_DATE_EPOCH: 0

      - name: Checksum the FINAL archive bytes
        run: |
          set -euo pipefail
          cd "$(dirname "$ARCHIVE")"
          sha256sum "$ARCHIVE_NAME" > "$ARCHIVE_NAME.sha256"
          digest="$(awk '{print $1}' "$ARCHIVE_NAME.sha256")"
          echo "ARCHIVE_SHA256=$digest" >> "$GITHUB_ENV"
          echo "CHECKSUM=$PWD/$ARCHIVE_NAME.sha256" >> "$GITHUB_ENV"
          echo "sha256($ARCHIVE_NAME) = $digest"

      - name: Re-gate and SBOM the EXTRACTED archive
        # Scanning the source checkout proves nothing about bytes that packaging
        # may add or transform, so the gate and the SBOM both run against what was
        # actually packaged. No rebuild happens here — this extracts $ARCHIVE.
        run: |
          set -euo pipefail
          ex="$RUNNER_TEMP/extract"
          mkdir -p "$ex"
          tar -xzf "$ARCHIVE" -C "$ex"
          root="$ex/$(ls "$ex")"
          bash scripts/check-public-core.sh --scan-root "$root" \
            --release-manifest "$root/release-membership.v1.json"
          sbom="$(dirname "$ARCHIVE")/${ARCHIVE_NAME%.tar.gz}.sbom.json"
          python3 scripts/lib/make_sbom.py --root "$root" --out "$sbom" \
            --name claude-harness --version "${GITHUB_REF_NAME#v}" \
            --archive-sha256 "$ARCHIVE_SHA256"
          echo "SBOM=$sbom" >> "$GITHUB_ENV"

      - name: Attest build provenance for THAT digest
        # Bound to the exact digest published as the checksum, so the attestation
        # cannot describe a different build than the one consumers download.
        # `id:` is what makes the bundle addressable — without it the attestation
        # was produced and then stranded, referenced by nothing and shipped nowhere.
        id: attest
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ env.ARCHIVE }}

      - name: Resolve the attestation bundle as a releasable asset
        # The attestation is the FOURTH published asset. Until it ships, provenance
        # is verifiable only online (verify-release-manifest.sh reaches "gh CLI
        # unavailable — cannot verify the attestation" with no network client), so
        # an offline consumer has no provenance artifact at all.
        # The bundle-path output name cannot be confirmed offline for this pinned
        # action version, so it is asserted rather than assumed: an empty or missing
        # bundle fails the release loudly here instead of silently publishing three
        # assets and reporting four.
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          if [ -z "${BUNDLE:-}" ] || [ ! -f "$BUNDLE" ]; then
            echo "::error::attestation bundle path did not resolve from the attest step outputs"
            echo "::error::(got '${BUNDLE:-<empty>}') — the pinned action's output name may differ;"
            echo "::error::resolve the correct output name rather than publishing without provenance"
            exit 1
          fi
          att="$(dirname "$ARCHIVE")/${ARCHIVE_NAME%.tar.gz}.attestation.jsonl"
          cp -p "$BUNDLE" "$att"
          echo "ATTESTATION=$att" >> "$GITHUB_ENV"

      - name: Create the release as a DRAFT (not publicly consumable yet)
        # --draft is the whole point: the release used to be created public and
        # verified afterwards, so a failing verification could not un-publish an
        # already-public artifact. A draft is invisible to consumers until the
        # promotion step below, which only runs if verification passed.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          flags=(--draft --title "$GITHUB_REF_NAME" --notes "Automated release for $GITHUB_REF_NAME. Verify with: bash scripts/verify-release-manifest.sh --tag $GITHUB_REF_NAME")
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" "${flags[@]}" \
            "$ARCHIVE" "$CHECKSUM" "$SBOM" "$ATTESTATION"

      - name: Verify the PUBLISHED asset (download the draft, do not rebuild)
        # Runs against the draft's own uploaded assets, so what is verified is what
        # promotion would expose. Deliberately NOT continue-on-error: a failure here
        # must leave the release unpromoted.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/verify-release-manifest.sh --tag "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --workdir "$RUNNER_TEMP/verify"

      - name: Promote the verified draft to a published release
        # Reached only when every preceding step succeeded, so publication is a
        # consequence of verification rather than a precondition for it.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release edit "$GITHUB_REF_NAME" --draft=false
          echo "promoted $GITHUB_REF_NAME to a published release after verification"
