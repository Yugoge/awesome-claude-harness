# Deploy target: /etc/tmpfiles.d/claude-scratch.conf
#
# Scratch Lifecycle Contract Layer C (task 20260907-015935): declarative
# backstop for the two Claude scratch roots. Both use the systemd-255 age-by
# prefix "mM:" — lowercase m = file mtime, uppercase M = directory mtime —
# so aging is immune to atime refresh (default aging honors atime, and daily
# bulk scans refresh it, which is why the pre-existing /tmp 30d rule never
# fires) AND immune to ctime (ctime cannot be backdated by any user API:
# utimensat(2) sets only atime+mtime and itself bumps ctime; a ctime-inclusive
# basis would never let a moved-in or freshly-touched scratch entry age out).
#
# /var/tmp/claude-scratch: the managed per-session root (settings.json
# env.TMPDIR). A session's own dir normally dies at SessionEnd via
# hooks/sessionend-scratch-sweep.sh — this 3d floor is ONLY the backstop for
# crashed/orphaned sessions that never fire SessionEnd.
#
# /dev/shm/claude-tmp: the legacy TMPDIR root this cycle retires (superseded
# by the disk-backed root above). This 2d rule declaratively drains its
# standing content with no one-shot bulk action — approved as declarative
# drain only (Decision Point 3); a one-time bulk delete was explicitly
# rejected and is NOT what this rule does.
#
# Type Path                              Mode UID  GID  Age
d      /var/tmp/claude-scratch           1777 root root mM:3d
d      /dev/shm/claude-tmp               1777 root root mM:2d
