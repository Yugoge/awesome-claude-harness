# Deploy target: /etc/tmpfiles.d/claude-scratch.conf
#
# Scratch Lifecycle Contract Layer C (task 20260907-015935): declarative
# backstop for the three Claude scratch roots declared below. All three use
# the systemd-255 age-by prefix "mM:" — lowercase m = file mtime, uppercase
# M = directory mtime — so aging is immune to atime refresh (tmpfiles.d(5):
# age-by defaults to "abcmABM", which counts atime, so a mere read would
# otherwise postpone cleanup; "mM:" makes these floors mean "untouched by
# writes", not "unread") AND immune to ctime (ctime cannot be backdated by
# any user API: utimensat(2) sets only atime+mtime and itself bumps ctime; a
# ctime-inclusive basis would never let a moved-in or freshly-touched scratch
# entry age out).
#
# /var/tmp/claude-scratch: the managed per-session root (settings.json
# env.TMPDIR). A session's own dir normally dies at SessionEnd via
# hooks/sessionend-scratch-sweep.sh — this 3d floor is ONLY the backstop for
# crashed/orphaned sessions that never fire SessionEnd.
#
# /dev/shm/claude-tmp: the former TMPDIR root, superseded for that purpose by
# the disk-backed root above (settings.json env.TMPDIR is now
# /var/tmp/claude-scratch). It still receives ad-hoc writes — measured
# 2026-10-02, all 280 files present postdate this rule's own deployment
# instant, newest same-day under an si-probe/pytest tree (same -newermt
# method as given for the third root below). So this 2d rule BOUNDS a rolling
# tree rather than draining a static one — no one-shot bulk action, approved
# as declarative only (Decision Point 3); a one-time bulk delete was
# explicitly rejected and is NOT what this rule does.
#
# /tmp/claude-scratch: the third root, and the one the original two rules left
# uncovered. It is NOT retired and is NOT draining toward empty — it is the
# CURRENT role-scratch namespace. policies/tool-policy.v1.json grants
# "*/tmp/claude-scratch/<role>/" as an allowed write prefix to 22 subagent
# roles, and that file's policy_version 7 _note calls those grants UNCHANGED
# and still allowed. Count method: JSON-parse the policy and count distinct
# $.roles.* keys holding such a prefix (22); a plain grep returns 23 because
# the _note mentions the pattern in prose too. Measured 2026-10-02, 583 of
# 672 files here postdate this rule's own deployment instant — re-measure with
# `find /tmp/claude-scratch -type f -newermt @$(stat -c %Y
# /etc/tmpfiles.d/claude-scratch.conf) | wc -l`. So DO NOT shorten, narrow or
# remove this rule on the belief that nothing writes here — that would destroy
# live role scratch; the 2d floor is a rolling bound on an active tree.
#
# No sweep reaches it, though: hooks/sessionend-scratch-sweep.sh resolves
# ROOT="${TMPDIR:-/var/tmp/claude-scratch}" and env.TMPDIR is
# /var/tmp/claude-scratch (settings.json), so the sweep only ever scans the
# live session root. The generic /tmp rule fails to cover this root for ONE
# reason — its age: 30d where 2d is needed. The aging basis is already right:
# the effective rule is `D /tmp 1777 root root mM:30d` from
# /etc/tmpfiles.d/tmp.conf (same task; tracked in-repo as
# scripts/install/tmpfiles-tmp-override.conf), which config-masks the
# distribution's atime-based `D /tmp 1777 root root 30d`. Read the effective
# rule with `systemd-tmpfiles --cat-config`, never from /usr/lib. The
# condition that motivated this rule, as recorded at creation (2026-10-01):
# 1.1G resident here, /tmp at 0 bytes free — which blocks any commit, because
# the push-gate token path in agents/changelog-analyst.md is hardcoded under
# /tmp/agentic-commit/. Same declarative treatment as the roots above, same 2d
# age — not a one-shot bulk delete.
#
# Type Path                              Mode UID  GID  Age
d      /var/tmp/claude-scratch           1777 root root mM:3d
d      /dev/shm/claude-tmp               1777 root root mM:2d
d      /tmp/claude-scratch               1777 root root mM:2d
