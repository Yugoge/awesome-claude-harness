# Deploy target: /etc/tmpfiles.d/tmp.conf
#
# Scratch Lifecycle Contract Layer C (task 20260907-015935): revives the
# system /tmp age rule. Deploying under the SAME FILENAME as
# /usr/lib/tmpfiles.d/tmp.conf gives this file config-masking precedence
# (systemd-tmpfiles(8): a file with an identical name in a higher-priority
# directory — /etc/ over /usr/lib/ — completely replaces the lower one), so
# this is the ONLY /tmp rule systemd-tmpfiles-clean.timer sees.
#
# The original rule — `D /tmp 1777 root root 30d` — is functionally inert:
# default aging honors atime (age-by defaults to abcmABM per tmpfiles.d(5)),
# and the daily bulk scan that walks /tmp for other purposes refreshes atime,
# so the 30d floor never fires in practice. This override keeps the EXACT
# SAME 30d age (nothing shortened, nothing removed) and switches ONLY the
# aging basis to mtime-only ("mM:") — atime- and ctime-immune — which is the
# root-cause fix (Decision Point 2, approved at the proposed 30d value).
#
# Type Path  Mode UID  GID  Age
D      /tmp  1777 root root mM:30d
